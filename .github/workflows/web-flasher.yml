# Builds firmware for the boards listed in web-flasher/boards.json and
# publishes it with a browser-based flasher (ESP Web Tools) on GitHub Pages.

name: Web flasher

on:
  push:
    branches: [main]
    paths:
      - esp32/**
      - web-flasher/**
      - .github/workflows/web-flasher.yml
  # PRs that touch the flasher build the site but don't deploy it.
  pull_request:
    paths:
      - web-flasher/**
      - .github/workflows/web-flasher.yml
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy half way; let the newest one win after it.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('web-flasher-{0}', github.event.pull_request.number) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  boards:
    name: Read board list
    runs-on: ubuntu-latest
    outputs:
      boards: ${{ steps.read.outputs.boards }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - id: read
        run: echo "boards=$(jq -c . web-flasher/boards.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.board }}
    needs: boards
    runs-on: ubuntu-latest
    container: espressif/idf:v6.0.1
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.boards.outputs.boards) }}
    defaults:
      run:
        shell: bash
        working-directory: esp32
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          DEFAULTS: sdkconfig.defaults${{ matrix.overlays }}
        run: |
          . "$IDF_PATH/export.sh" > /dev/null
          idf.py -B build -DIDF_TARGET="$TARGET" -DSDKCONFIG=build/sdkconfig \
            -DSDKCONFIG_DEFAULTS="$DEFAULTS" build

      - name: Package
        env:
          BOARD: ${{ matrix.board }}
          NAME: ${{ matrix.name }}
        run: |
          python3 ../web-flasher/make_manifest.py build "out/$BOARD" \
            "Muse Gadget ($NAME)" "$(cat version.txt)+${GITHUB_SHA::7}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware-${{ matrix.board }}
          path: esp32/out/
          if-no-files-found: error

  site:
    name: Assemble site
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: firmware-*
          path: site/firmware
          merge-multiple: true

      - name: Add page
        run: |
          cp web-flasher/index.html web-flasher/boards.json site/
          echo "{\"commit\": \"$GITHUB_SHA\"}" > site/build.json

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: site
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
